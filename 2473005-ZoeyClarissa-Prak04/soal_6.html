<!DOCTYPE html>
<html>
<head>
    <title>Table Styling</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid #98bf21;
        }

        th, td {
            border: 1px solid #98bf21;
            padding: 4px;
        }

        th {
            background-color: #98bf21;
            color: white;
            text-align: left;
        }

        .k {
            background-color: #f5f5c6;
        }

        .h {
            background-color: #eaf2d3;
        }

        .f {
            background-color: #98bf21;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Company</th>
        <th>Contact</th>
        <th>Country</th>
    </tr>

    <tr>
        <td class="k">Alfreds Futterkiste</td>
        <td class="h">Maria Anders</td>
        <td class="k">Germany</td>
    </tr>

    <tr>
        <td class="h">Berglunds snabbköp</td>
        <td class="k">Christina Berglund</td>
        <td class="h">Sweden</td>
    </tr>

    <tr>
        <td class="k">Centro comercial Moctezuma</td>
        <td class="h">Francisco Chang</td>
        <td class="k">Mexico</td>
    </tr>

    <tr>
        <td class="h">Ernst Handel</td>
        <td class="k">Roland Mendel</td>
        <td class="h">Austria</td>
    </tr>

    <tr>
        <td class="k">Island Trading</td>
        <td class="h">Helen Bennett</td>
        <td class="k">UK</td>
    </tr>

    <tr class="f">
        <td colspan="3">© www.w3schools.org</td>
    </tr>

</table>

</body>
</html>

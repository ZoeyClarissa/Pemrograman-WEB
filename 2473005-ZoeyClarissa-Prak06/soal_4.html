<!DOCTYPE html>
<html>
    <head>
        <title>db</title>
        <script type="text/javascript">
            function db() {
                var inp = document.getElementById("in").value
                var pilih = document.getElementById("pilih").value

                if (pilih == "option1") {
                    if (isNaN(inp) || inp < 0 || inp > 255) {
                        alert("hanya bisa diisi dengan angka 0 s/d 255");
                        return;
                    }
                    var db1 = parseInt(inp);
                    var biner = "";
                    while (db1 > 0) {
                        biner = (db1 % 2) + biner;
                        db1 = Math.floor(db1 / 2);
                    }
                    document.getElementById("out").value = biner;
                }
                else if (pilih == "option2") {
                    if (inp.length != 8 || /[^01]/.test(inp)) {
                        alert("harus 8 digit 0 dan 1");
                        return;
                    }
                    var hasil = 0;
                    for (var i = 0; i < inp.length; i++) {
                        hasil = hasil * 2 + parseInt(inp[i]);
                    }
                    document.getElementById("out").value = hasil;
                }
            }
            function reset() {
                document.getElementById("in").value = "";
                document.getElementById("out").value = "";
            }
            

        </script>
    </head>
    <body>
        <table border="1" cellpadding>
            <tr>
                <td>Input:</td>
                <td><input type="text" id="in"></td>
            </tr>
            <tr>
                <td>Output:</td>
                <td><input type="text" id="out"></td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <select id="pilih">
                    <option value="option1">decimal-biner</option>
                    <option value="option2">biner-decimal</option>
                    </select>
                </td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <button onclick="db()">PROSES</button> 
                    <button onclick="reset()">RESET</button>
                </td>
            </tr>
        </table>
    </body>
</html>
